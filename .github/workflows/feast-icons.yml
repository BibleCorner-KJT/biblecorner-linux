name: Icons of the great feasts (Wikimedia Commons)
on:
  push:
    branches: [main]
    paths: ['icons/*.py', '.github/workflows/feast-icons.yml']
jobs:
  get:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 icons/look.py
