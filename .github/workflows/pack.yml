# The offline pack (tools/make_pack.py): everything the apps need with no internet, made from the website and kept
# on the branch "pack". The Linux app is built with it; the Android app takes it too. Runs by hand and every week.
name: Make the offline pack
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Make the pack
        run: python3 tools/make_pack.py /tmp/pack
      - name: Keep it on the branch "pack"
        run: |
          set -e
          cd /tmp/pack
          git init -q && git checkout -q -b pack
          git config user.name "github-actions" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "The offline pack, $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pack
