name: SimpleX daily posts
on:
  schedule:
    - cron: '17 * * * *'       # each hour: it joins groups, and sends what waits for it on the website
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sx-bot/**', '.github/workflows/simplex-bot.yml']
concurrency: simplex-bot
jobs:
  post:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: SimpleX Chat (the program)
        run: |
          mkdir -p ~/sxbin
          curl -fsSL -o ~/sxbin/simplex-chat https://github.com/simplex-chat/simplex-chat/releases/latest/download/simplex-chat-ubuntu-22_04-x86_64
          chmod +x ~/sxbin/simplex-chat
      - name: The bot's keys (kept from the last run)
        uses: actions/cache/restore@v4
        with:
          path: ~/sxdata
          key: sxdata-${{ github.run_id }}
          restore-keys: sxdata-
      - name: Visit the website, join, send
        run: bash sx-bot/run.sh
      - name: Keep the bot's keys
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/sxdata
          key: sxdata-${{ github.run_id }}
