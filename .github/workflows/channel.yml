# The app's own channel in GNOME Software: every change on main is built, signed and published at
# https://biblecorner-kjt.github.io/biblecorner-linux/ (installed copies update from there by themselves).
# The signing key is kept in the repository's secret FLATPAK_GPG_KEY; it never appears in the files.
name: Publish the app channel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: channel
  cancel-in-progress: true
jobs:
  # 2.34: the same app for ARM (Linux phones such as the Fairphone 5 with postmarketOS, Raspberry Pi, ARM laptops).
  # Built on GitHub's ARM machine; the channel then holds both, and each device installs the one that fits it.
  # If this part fails, the PC version is still published as before.
  arm:
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: The offline pack (branch "pack") inside the app
        continue-on-error: true
        run: |
          git config --global --add safe.directory '*'
          git fetch --depth 1 origin pack && mkdir -p src/kjt/pack && git --work-tree=src/kjt/pack checkout FETCH_HEAD -- . && git reset -q && du -sh src/kjt/pack
      - name: Build for ARM
        run: |
          set -e
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --disable-rofiles-fuse --force-clean --default-branch=stable --arch=aarch64 \
            --install-deps-from=flathub --repo=repo-arm build today.knowingjesus.KJT.yml
          tar -cf repo-arm.tar repo-arm
      - uses: actions/upload-artifact@v4
        with:
          name: repo-arm
          path: repo-arm.tar
          retention-days: 1
  build:
    needs: arm
    if: always()
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: The offline pack (branch "pack") inside the app
        continue-on-error: true
        run: |
          git config --global --add safe.directory '*'
          git fetch --depth 1 origin pack && mkdir -p src/kjt/pack && git --work-tree=src/kjt/pack checkout FETCH_HEAD -- . && git reset -q && du -sh src/kjt/pack
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: repo-arm
      - name: Build and sign
        env:
          GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          set -e
          if [ -z "$GPG_KEY" ]; then echo "The secret FLATPAK_GPG_KEY is not set yet"; exit 1; fi
          export GNUPGHOME="$RUNNER_TEMP/gpg"; mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --disable-rofiles-fuse --force-clean --default-branch=stable \
            --gpg-sign="$FPR" --gpg-homedir="$GNUPGHOME" --repo=repo build today.knowingjesus.KJT.yml
          # the ARM version (when its build worked) joins the same channel, signed with the same key
          HAVE_ARM=0
          if [ -f repo-arm.tar ] && tar -xf repo-arm.tar; then
            for R in $(ostree refs --repo=repo-arm | grep '/aarch64/'); do
              flatpak build-commit-from --src-repo=repo-arm --gpg-sign="$FPR" --gpg-homedir="$GNUPGHOME" --no-update-summary repo "$R"
            done
            ostree refs --repo=repo | grep -q '^app/today.knowingjesus.KJT/aarch64/' && HAVE_ARM=1
          fi
          echo "ARM version in the channel: $HAVE_ARM"
          flatpak build-update-repo --generate-static-deltas --prune --title="Bible Corner - KJT" --default-branch=stable \
            --gpg-sign="$FPR" --gpg-homedir="$GNUPGHOME" repo
          KEY=$(base64 -w0 channel/kjt-channel.gpg)
          URL=https://biblecorner-kjt.github.io/biblecorner-linux
          mkdir -p site && cp -r repo site/repo && cp channel/index.html channel/icon.png channel/kjt-channel.gpg site/
          # the old public-domain atlas plates (branch "atlas"), served beside the channel for the website and the apps
          git clone -q --depth 1 -b atlas "https://github.com/${{ github.repository }}.git" atlas-src-tmp && cp -r atlas-src-tmp/atlas site/atlas && rm -rf atlas-src-tmp
          # the CrossWire Bibles converted for the website (branch "bibles"): the Install button of each fetches its file here
          git clone -q --depth 1 -b bibles "https://github.com/${{ github.repository }}.git" bibles-tmp && cp -r bibles-tmp/packs site/bibles && rm -rf bibles-tmp
          cat > site/knowing-jesus-today.flatpakrepo <<REPO
          [Flatpak Repo]
          Title=Bible Corner - KJT
          Url=$URL/repo/
          Homepage=https://knowingjesus.today/
          Comment=The Bible Corner - KJT app for Linux (knowingjesus.today)
          Icon=$URL/icon.png
          DefaultBranch=stable
          GPGKey=$KEY
          REPO
          cat > site/knowing-jesus-today.flatpakref <<REF
          [Flatpak Ref]
          Name=today.knowingjesus.KJT
          Branch=stable
          Title=Bible Corner - KJT
          Url=$URL/repo/
          SuggestRemoteName=knowingjesus
          Homepage=https://knowingjesus.today/
          Icon=$URL/icon.png
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          IsRuntime=false
          GPGKey=$KEY
          REF
          sed -i 's/^ *//' site/knowing-jesus-today.flatpakrepo site/knowing-jesus-today.flatpakref
          # the file people download is named after the app and its version: "Bible Corner - KJT 2.27 (Linux).flatpakref"
          # (knowing-jesus-today.flatpakref stays for old links); linux.json tells the website the version and the name
          VER=$(sed -n "s/^VERSION = '\(.*\)'/\1/p" src/kjt/main.py)
          cp site/knowing-jesus-today.flatpakref "site/Bible Corner - KJT $VER (Linux).flatpakref"
          cp site/knowing-jesus-today.flatpakref site/bible-corner-kjt-linux.flatpakref
          printf '{"version":"%s","ref":"Bible Corner - KJT %s (Linux).flatpakref"}\n' "$VER" "$VER" > site/linux.json
          sed -i "s|href=\"knowing-jesus-today.flatpakref\"|href=\"Bible Corner - KJT $VER (Linux).flatpakref\" download|" site/index.html
          # one file that installs the app with a double click (or flatpak install), and keeps it updated from this channel
          flatpak build-bundle --repo-url=$URL/repo/ --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo --gpg-keys=channel/kjt-channel.gpg \
            repo "site/Bible Corner - KJT $VER (Linux).flatpak" today.knowingjesus.KJT stable
          cp "site/Bible Corner - KJT $VER (Linux).flatpak" site/bible-corner-kjt-linux.flatpak
          # 2.34: the one-file install for ARM devices (Linux phones), when the ARM version was built
          if [ "$HAVE_ARM" = 1 ]; then
            flatpak build-bundle --arch=aarch64 --repo-url=$URL/repo/ --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo --gpg-keys=channel/kjt-channel.gpg \
              repo "site/Bible Corner - KJT $VER (Linux ARM).flatpak" today.knowingjesus.KJT stable
            cp "site/Bible Corner - KJT $VER (Linux ARM).flatpak" site/bible-corner-kjt-linux-arm.flatpak
            printf '{"version":"%s","ref":"Bible Corner - KJT %s (Linux).flatpakref","arm":"Bible Corner - KJT %s (Linux ARM).flatpak"}\n' "$VER" "$VER" "$VER" > site/linux.json
          fi
          # the same file kept in the branch "bundle" (only the newest), for sending it directly
          mkdir -p bundle-tmp && cp "site/Bible Corner - KJT $VER (Linux).flatpak" bundle-tmp/
          [ "$HAVE_ARM" = 1 ] && cp "site/Bible Corner - KJT $VER (Linux ARM).flatpak" bundle-tmp/
          ( cd bundle-tmp && git init -q -b bundle && git add -A && git -c user.email=ci@local -c user.name=CI commit -qm "Linux $VER bundle" \
            && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" bundle ) || echo "bundle branch not updated"
          rm -rf bundle-tmp
          touch site/.nojekyll
          du -sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
