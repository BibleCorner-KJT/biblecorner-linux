# The app's own channel in GNOME Software: every change on main is built, signed and published at
# https://biblecorner-kjt.github.io/biblecorner-linux/ (installed copies update from there by themselves).
# The signing key is kept in the repository's secret FLATPAK_GPG_KEY; it never appears in the files.
name: Publish the app channel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: channel
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build and sign
        env:
          GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          set -e
          if [ -z "$GPG_KEY" ]; then echo "The secret FLATPAK_GPG_KEY is not set yet"; exit 1; fi
          export GNUPGHOME="$RUNNER_TEMP/gpg"; mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --disable-rofiles-fuse --force-clean --default-branch=stable \
            --gpg-sign="$FPR" --gpg-homedir="$GNUPGHOME" --repo=repo build today.knowingjesus.KJT.yml
          flatpak build-update-repo --generate-static-deltas --prune --title="Knowing Jesus Today" --default-branch=stable \
            --gpg-sign="$FPR" --gpg-homedir="$GNUPGHOME" repo
          KEY=$(base64 -w0 channel/kjt-channel.gpg)
          URL=https://biblecorner-kjt.github.io/biblecorner-linux
          mkdir -p site && cp -r repo site/repo && cp channel/index.html channel/icon.png channel/kjt-channel.gpg site/
          cat > site/knowing-jesus-today.flatpakrepo <<REPO
          [Flatpak Repo]
          Title=Knowing Jesus Today
          Url=$URL/repo/
          Homepage=https://knowingjesus.today/
          Comment=The Knowing Jesus Today app for Linux
          Icon=$URL/icon.png
          DefaultBranch=stable
          GPGKey=$KEY
          REPO
          cat > site/knowing-jesus-today.flatpakref <<REF
          [Flatpak Ref]
          Name=today.knowingjesus.KJT
          Branch=stable
          Title=Knowing Jesus Today
          Url=$URL/repo/
          SuggestRemoteName=knowingjesus
          Homepage=https://knowingjesus.today/
          Icon=$URL/icon.png
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          IsRuntime=false
          GPGKey=$KEY
          REF
          sed -i 's/^ *//' site/knowing-jesus-today.flatpakrepo site/knowing-jesus-today.flatpakref
          touch site/.nojekyll
          du -sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
